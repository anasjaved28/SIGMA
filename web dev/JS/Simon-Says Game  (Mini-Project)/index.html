<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simon-Says Game</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Simon Game</h1>

    <h2>Press any key to Start the Game.</h2>

    <div class="container">
      <div id="red" class="colorBox A red" type="button"></div>
      <div id="blue" class="colorBox B blue" type="button"></div>
      <div id="green" class="colorBox C green" type="button"></div>
      <div id="yellow" class="colorBox D yellow" type="button"></div>
    </div>
    <h3>High Score: 0</h3>

    <script src="script.js"></script>
  </body>
</html>
